{% extends 'admission/partials/base.html' %}
{% load static %}

{% block title %}{{ error_code }} — {{ error_description }} | EduThanzeel{% endblock %}

{% block content %}
<section class="welcome-three home-welcome-section" style="padding: 100px 0 120px; background-color: #fff9df;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10 text-center">
        <h1 class="headings mb-3" style="color: #1c4da2; font-size: clamp(4rem, 14vw, 7.5rem); line-height: 1; letter-spacing: -0.02em;">
          {{ error_code }}
        </h1>
        <p class="welcome-three_text mx-auto" style="font-size: 1.35rem; line-height: 1.55; max-width: 28rem; color: #1e293b;">
          {{ error_description }}
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
